name: Reedsy
description: Reedsy is a marketplace and toolset for authors and publishers, connecting
  writers with a curated network of more than 3,700 vetted publishing professionals
  including editors, book designers, marketers, ghostwriters, web designers, and translators.
  Beyond the marketplace, Reedsy offers Reedsy Studio (a free writing and book-formatting
  application), Reedsy Learning (courses and events), Reedsy Discovery (book reviews),
  and Reedsy Prompts (weekly writing prompts). It supports authors across the full
  self-publishing journey from manuscript development through market launch. Reedsy
  is backed by Seedcamp and publishes no public developer API today.
